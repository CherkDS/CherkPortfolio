<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кодинг | Портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0b0f;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        .lang-switcher {
            position: absolute;
            top: 40px;
            right: 20px;
            background: #141419;
            border: 1px solid #1f1f2e;
            color: #f3f4f6;
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
            z-index: 10;
        }

        .lang-switcher:hover {
            border-color: #6366f1;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* --- Анимации --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* Навигация назад */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 40px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .back-link svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* Шапка страницы */
        .page-header {
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #6b7280 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: #9ca3af;
            font-size: 1.1rem;
        }

        /* Секции */
        section {
            margin-bottom: 60px;
        }

        section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Заглушка "Скоро!" */
        .coming-soon {
            background: #141419;
            border: 1px solid #1f1f2e;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            color: #9ca3af;
        }

        .coming-soon h3 {
            font-size: 1.5rem;
            color: #f3f4f6;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .lang-switcher {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <a href="en/code.html" class="lang-switcher">EN</a>

    <div class="container">
        <!-- Назад -->
        <a href="index.html" class="back-link fade-in">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            На главную
        </a>

        <!-- Шапка -->
        <div class="page-header fade-in delay-1">
            <h1>Кодинг & Разработка</h1>
            <p>Создание скриптов, ботов, сайтов и плагинов майнкрафт.</p>
        </div>

        <!-- Недавние работы (Заглушка) -->
        <section class="fade-in delay-2">
            <h2>🔥 Недавние работы</h2>
            
            <div class="coming-soon">
                <h3>Скоро!</h3>
                <p>Здесь появятся мои проекты по программированию и веб-разработке.</p>
            </div>
        </section>

    </div>

</body>
</html>
