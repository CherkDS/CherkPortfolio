<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherk | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0b0f;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Кнопка переключения языка в верхнем правом углу */
        .lang-switcher {
            position: absolute;
            top: 25px;
            right: 30px;
            background: #141419;
            border: 1px solid #1f1f2e;
            color: #f3f4f6;
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
            z-index: 10;
        }

        .lang-switcher:hover {
            border-color: #6366f1;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
            margin: auto 0;
        }

        @keyframes titleReveal {
            0% { opacity: 0; transform: translateY(-30px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes descReveal {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #6b7280 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .profile-header p {
            font-size: 1.15rem;
            color: #9ca3af;
            max-width: 600px;
            margin: 0 auto 50px auto;
            line-height: 1.6;
            animation: descReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            opacity: 0;
        }

        .nav-card {
            background: #141419;
            border: 1px solid #1f1f2e;
            border-radius: 20px;
            padding: 40px 20px;
            text-decoration: none;
            color: #f3f4f6;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .nav-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #6366f1;
            background: #161622;
            box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.25);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: #1f1f2e;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.3s;
        }

        .nav-card:hover .icon-box {
            background: #6366f1;
            transform: scale(1.1) rotate(5deg);
        }

        .icon-box svg {
            width: 28px;
            height: 28px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-card h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .nav-card p {
            font-size: 0.9rem;
            color: #9ca3af;
            transition: color 0.3s;
            animation: none !important;
            opacity: 1 !important;
            max-width: none;
            margin: 0;
        }

        .nav-card:hover p {
            color: #d1d5db;
        }

        footer {
            display: flex;
            gap: 25px;
            font-size: 0.95rem;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            opacity: 0;
        }

        footer a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
        }

        footer a:hover {
            color: #ffffff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            .profile-header h1 {
                font-size: 2.2rem;
            }
            .lang-switcher {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
                </div>
                <h2>Design</h2>
                <p>Banners, thumbnails, informative posts</p>
            </a>

            <a href="video.html" class="nav-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                </div>
                <h2>Video Editing</h2>
                <p>Edits, motion design, video editing</p>
            </a>

            <a href="code.html" class="nav-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                </div>
                <h2>Coding</h2>
                <p>Development of bots, websites, etc.</p>
            </a>
        </div>
    </div>

        <a href="https://t.me/cherk122" target="_blank">Telegram</a>

</html>
